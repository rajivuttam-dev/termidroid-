<!doctype html>
<html lang="en" data-theme="matrix">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="description" content="TermiDroid Pro — offline, installable, mobile-first Linux terminal with persistent virtual filesystem, nano editor, and touch keybar.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TermiDroid">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23000'/%3E%3Ctext x='14' y='68' font-family='monospace' font-size='48' fill='%2358ff7a'%3E%3E_%3C/text%3E%3C/svg%3E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23000'/%3E%3Ctext x='14' y='68' font-family='monospace' font-size='48' fill='%2358ff7a'%3E%3E_%3C/text%3E%3C/svg%3E">
<title>TermiDroid Pro — Mobile Linux Terminal</title>
<style>
:root{
  --fs:15px;
  --bg:#000;--bar:#0b0b0b;--panel:#0d0d0d;--text:#f2f2f2;--muted:#8a8a8a;
  --green:#58ff7a;--blue:#5aa9ff;--red:#ff5f5f;--yellow:#ffd75f;--cyan:#5ff2ff;--magenta:#d88cff;
  --border:#1e1e1e;--selection:#193c25;--key:#161616;--key-border:#2a2a2a;
  --mono:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
}
html[data-theme="amoled"]{--bg:#000;--bar:#000;--panel:#000;--border:#1a1a1a;--green:#4dff88;--key:#0a0a0a}
html[data-theme="dracula"]{--bg:#282a36;--bar:#1e1f29;--panel:#21222c;--text:#f8f8f2;--muted:#8f93a8;--green:#50fa7b;--blue:#8be9fd;--red:#ff5555;--yellow:#f1fa8c;--cyan:#8be9fd;--magenta:#bd93f9;--border:#343746;--selection:#44475a;--key:#2b2d3a;--key-border:#44475a}
html[data-theme="amber"]{--bg:#0d0800;--bar:#140d00;--panel:#161000;--text:#ffe9c4;--muted:#a68a5b;--green:#ffb000;--blue:#ffd166;--red:#ff6b6b;--yellow:#ffe08a;--cyan:#ffd166;--magenta:#ff9f1c;--border:#2b1f08;--selection:#3d2b08;--key:#1c1305;--key-border:#3a2a0c}
html[data-theme="light"]{--bg:#f6f6f6;--bar:#ececec;--panel:#fff;--text:#141414;--muted:#6f6f6f;--green:#0a8a2e;--blue:#0b5fd1;--red:#c22;--yellow:#8a6d00;--cyan:#0b6fd1;--magenta:#7a2fd1;--border:#d8d8d8;--selection:#cdeed6;--key:#f0f0f0;--key-border:#d0d0d0}
html[data-theme="light"] .app,html[data-theme="light"] .output,html[data-theme="light"] .input-row,
html[data-theme="light"] .terminal-head,html[data-theme="light"] .status,html[data-theme="light"] #editor,
html[data-theme="light"] .nano{background:var(--bg);color:var(--text)}
html[data-theme="light"] .input{color:#111}
html[data-theme="light"] .out{color:#222}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
*::selection{background:var(--selection)}
html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text);overscroll-behavior:none}
body{font-family:var(--mono);overflow:hidden;position:fixed;inset:0}
.app{height:100dvh;display:flex;flex-direction:column;background:var(--bg);padding-top:var(--sat)}
.top{min-height:46px;flex:0 0 auto;background:var(--bar);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:4px 6px;gap:6px}
.iconbtn{min-width:42px;height:42px;border:1px solid transparent;background:transparent;color:#aaa;border-radius:10px;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;touch-action:manipulation}
.iconbtn:active{background:#1c1c1c;color:#fff}
html[data-theme="light"] .iconbtn:active{background:#ddd}
.tabs{display:flex;flex:1;gap:6px;overflow-x:auto;padding:4px 2px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;height:36px;min-width:96px;max-width:170px;padding:0 8px 0 12px;border:1px solid var(--border);border-radius:20px;background:transparent;color:var(--muted);display:flex;align-items:center;gap:8px;cursor:pointer;font-size:12px;touch-action:manipulation}
.tab.active{background:var(--key);color:var(--text);border-color:var(--key-border)}
.tab .dot{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.6;flex:0 0 7px}
.tab.active .dot{background:var(--green);opacity:1}
.tab .close{width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:50%;font-size:15px;color:inherit}
.tab .close:active{background:#ffffff22}
.main{position:relative;flex:1;min-height:0;display:flex}
.terminal{width:100%;height:100%;display:flex;flex-direction:column;min-width:0}
.terminal-head{min-height:28px;flex:0 0 auto;border-bottom:1px solid var(--border);background:var(--bg);color:var(--muted);display:flex;align-items:center;padding:5px 12px;font-size:11px;gap:8px}
.terminal-head .cwd{color:var(--blue);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.terminal-head .meta{flex:0 0 auto;display:flex;gap:10px;align-items:center}
.output{flex:1;min-height:0;overflow-y:auto;padding:12px 12px 6px;font-size:var(--fs);line-height:1.6;white-space:pre-wrap;word-break:break-word;-webkit-overflow-scrolling:touch;user-select:text}
.output::-webkit-scrollbar{width:6px}.output::-webkit-scrollbar-thumb{background:#2a2a2a;border-radius:10px}
.line{min-height:1.6em}
.prompt{color:var(--green)}.out{color:var(--text)}.muted{color:var(--muted)}.err{color:var(--red)}.info{color:var(--blue)}.warn{color:var(--yellow)}.ok{color:var(--green)}.cyan{color:var(--cyan)}
.chips{flex:0 0 auto;display:flex;gap:8px;overflow-x:auto;padding:6px 10px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;font-size:12px;border:1px solid var(--key-border);background:var(--key);color:var(--text);border-radius:16px;padding:8px 12px;cursor:pointer;touch-action:manipulation;min-height:36px}
.chip:active{border-color:var(--green)}
.suggest{margin:4px 10px 0;max-width:640px;background:var(--panel);border:1px solid var(--key-border);border-radius:10px;overflow:hidden;display:none;z-index:12}
.suggest div{padding:10px 12px;font-size:13px;color:var(--text);cursor:pointer;min-height:42px;display:flex;align-items:center}
.suggest div+div{border-top:1px solid var(--border)}
.suggest div.active{background:#ffffff12}
.keybar{flex:0 0 auto;display:flex;gap:6px;overflow-x:auto;padding:8px 10px 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.keybar::-webkit-scrollbar{display:none}
.key{flex:0 0 auto;min-width:44px;min-height:42px;padding:0 12px;border:1px solid var(--key-border);background:var(--key);color:var(--text);border-radius:9px;font-family:var(--mono);font-size:13px;cursor:pointer;touch-action:manipulation;user-select:none}
.key:active{background:var(--green);color:#000;border-color:var(--green)}
.key.fn{color:var(--green)}
.input-row{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:6px 10px calc(8px + var(--sab));background:var(--bg);border-top:1px solid var(--border)}
.prompt-live{color:var(--green);white-space:nowrap;font-size:13px;flex:0 0 auto;max-width:38vw;overflow:hidden;text-overflow:ellipsis}
.input{min-width:0;flex:1;border:1px solid transparent;background:var(--panel);color:var(--text);font:var(--fs) var(--mono);padding:11px 12px;border-radius:10px;outline:0;caret-color:var(--green)}
.input:focus{border-color:var(--green)}
.send{min-width:48px;height:48px;border:0;border-radius:11px;background:var(--green);color:#000;font-size:19px;font-weight:700;cursor:pointer;touch-action:manipulation}
.send:active{filter:brightness(.9)}
.mic{min-width:48px;height:48px;border:1px solid var(--key-border);border-radius:11px;background:var(--key);color:var(--text);font-size:18px;cursor:pointer}
.status{min-height:24px;flex:0 0 auto;border-top:1px solid var(--border);background:var(--bar);color:var(--muted);display:flex;align-items:center;padding:3px 10px calc(3px + 0px);font-size:10px;gap:12px;padding-bottom:calc(3px + var(--sab) * 0)}
.status .right{margin-left:auto;display:flex;gap:10px}
.overlay{position:absolute;inset:0;background:#000000cc;display:none;z-index:50;align-items:flex-end;justify-content:center;padding:0}
@media(min-width:700px){.overlay{align-items:center;padding:18px}}
.modal{width:min(680px,100%);max-height:92%;overflow:hidden;background:var(--panel);border:1px solid var(--key-border);border-radius:16px 16px 0 0;display:flex;flex-direction:column;box-shadow:0 20px 70px #000}
@media(min-width:700px){.modal{border-radius:14px}}
.modal-head{min-height:52px;display:flex;align-items:center;padding:0 8px 0 16px;border-bottom:1px solid var(--border);font-size:13px;color:var(--text);gap:8px}
.modal-head button{margin-left:auto;min-width:44px;min-height:44px;background:none;border:0;color:var(--muted);cursor:pointer;font-size:22px;border-radius:10px}
.modal-body{padding:12px 14px 20px;font-size:13px;line-height:1.7;color:var(--text);overflow:auto}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:420px){.grid{grid-template-columns:1fr}}
.mbtn{border:1px solid var(--key-border);background:var(--key);color:var(--text);border-radius:11px;padding:13px 12px;font-size:13px;text-align:left;cursor:pointer;min-height:48px;touch-action:manipulation}
.mbtn small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.mbtn:active{border-color:var(--green)}
.fsrow{display:flex;align-items:center;gap:10px;padding:11px 8px;border-bottom:1px solid var(--border);cursor:pointer;min-height:48px}
.fsrow:active{background:#ffffff0d}
.fsrow .ic{flex:0 0 28px;text-align:center}
.fsrow .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fsrow .sz{color:var(--muted);font-size:11px;flex:0 0 auto}
.crumbs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.crumbs::-webkit-scrollbar{display:none}
.crumb{flex:0 0 auto;border:1px solid var(--key-border);border-radius:14px;padding:6px 11px;font-size:12px;background:var(--key)}
.setrow{display:flex;align-items:center;gap:10px;padding:12px 2px;border-bottom:1px solid var(--border);min-height:52px}
.setrow label{flex:1}
.setrow select,.setrow input[type=text]{background:var(--key);color:var(--text);border:1px solid var(--key-border);border-radius:9px;padding:10px;font-family:var(--mono);font-size:13px;max-width:170px}
.switch{width:52px;height:32px;border-radius:20px;background:#333;border:1px solid var(--key-border);position:relative;cursor:pointer;flex:0 0 52px}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#888;transition:left .15s,background .15s}
.switch.on{background:#0d3a1c;border-color:var(--green)}
.switch.on::after{left:23px;background:var(--green)}
#editor{position:absolute;inset:0;background:var(--bg);display:none;z-index:60;flex-direction:column}
.nano-top{min-height:50px;background:var(--bar);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:4px 6px 4px 12px;font-size:12px;gap:8px}
.nano-top b{color:var(--text)}.nano-top .path{color:var(--blue);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.ebtn{min-width:48px;height:42px;border-radius:9px;border:1px solid var(--key-border);background:var(--key);color:var(--text);font-size:12px;cursor:pointer;padding:0 12px}
.ebtn.primary{background:var(--green);color:#000;border-color:var(--green);font-weight:700}
.nano-tools{display:flex;gap:6px;overflow-x:auto;padding:7px 10px;border-bottom:1px solid var(--border);scrollbar-width:none}
.nano-tools::-webkit-scrollbar{display:none}
.nano-body{flex:1;min-height:0;display:flex}
.nums{width:40px;flex:0 0 40px;padding:10px 6px 10px 0;text-align:right;color:var(--muted);line-height:1.6;font-size:13px;overflow:hidden;user-select:none;opacity:.7}
.nano{flex:1;min-width:0;resize:none;border:0;outline:0;background:var(--bg);color:var(--text);font:13px/1.6 var(--mono);padding:10px 10px 30px;white-space:pre;overflow:auto}
.nano-foot{min-height:34px;border-top:1px solid var(--border);background:var(--bar);color:var(--muted);display:flex;align-items:center;padding:6px 12px calc(6px + var(--sab));font-size:11px;gap:14px;overflow-x:auto;white-space:nowrap}
.kbd-hint{font-size:10px;color:var(--muted);padding:0 12px 2px}
.splash{position:absolute;inset:0;background:#000;z-index:100;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;transition:opacity .3s}
.splash .logo{font-size:44px;color:var(--green)}
.splash .bar{width:180px;height:3px;background:#1c1c1c;border-radius:10px;overflow:hidden}
.splash .bar i{display:block;height:100%;width:40%;background:var(--green);border-radius:10px;animation:load 1s infinite}
@keyframes load{0%{margin-left:-40%}100%{margin-left:100%}}
@media(prefers-reduced-motion:reduce){.splash .bar i{animation:none}}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <button class="iconbtn" id="menuBtn" aria-label="Menu" title="Menu">☰</button>
    <div class="tabs" id="tabs" role="tablist" aria-label="Terminal tabs"></div>
    <button class="iconbtn" id="newTab" aria-label="New tab" title="New tab">＋</button>
    <button class="iconbtn" id="installBtn" aria-label="Install app" title="Install app" style="display:none">⤓</button>
  </header>
  <main class="main">
    <section class="terminal" aria-label="Terminal">
      <div class="terminal-head"><span>termidroid · pro</span><span class="cwd" id="termPath">/home/user</span><span class="meta"><span id="storeMeta"></span><span id="netMeta">●</span></span></div>
      <div class="output" id="output" aria-live="polite"></div>
      <div class="chips" id="chips" aria-label="Quick commands"></div>
      <div class="suggest" id="suggest"></div>
      <div class="keybar" id="keybar" aria-label="Terminal keys"></div>
      <div class="input-row">
        <span class="prompt-live" id="prompt">❯</span>
        <input class="input" id="input" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="send" aria-label="Terminal input" placeholder="type a command… (try: help)">
        <button class="mic" id="micBtn" aria-label="Voice input" title="Voice input" style="display:none">🎙</button>
        <button class="send" id="sendBtn" aria-label="Run command" title="Run (Enter)">⏎</button>
      </div>
      <div class="kbd-hint">Tab ✓ complete · ↑↓ history · swipe keys ←→ · tap output to focus</div>
      <footer class="status"><span id="stOs">UTF-8 · vfs</span><span id="stShell">bash</span><span class="right"><span id="stStore"></span><span id="clock"></span><span id="batt"></span></span></footer>
    </section>
    <div class="overlay" id="overlay"><div class="modal" role="dialog" aria-modal="true"><div class="modal-head"><span id="modalTitle">Menu</span><button id="modalClose" aria-label="Close">×</button></div><div class="modal-body" id="modalBody"></div></div></div>
    <section id="editor" aria-label="File editor">
      <div class="nano-top"><b>nano</b><span class="path" id="editPath"></span><button class="ebtn primary" id="saveBtn">Save</button><button class="ebtn" id="exitBtn">Exit</button></div>
      <div class="nano-tools" id="nanoTools"></div>
      <div class="nano-body"><div class="nums" id="nums"></div><textarea id="nano" class="nano" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="File contents"></textarea></div>
      <div class="nano-foot"><span id="nanoStat">—</span><span id="wrapToggle">wrap: <b id="wrapState">on</b> (tap to toggle)</span></div>
    </section>
    <div class="splash" id="splash"><div class="logo">&gt;_</div><div>TermiDroid Pro</div><div class="bar"><i></i></div></div>
  </main>
</div>
<input type="file" id="filepick" style="display:none" multiple>
<script>
"use strict";
/* TermiDroid Pro v6 — offline mobile terminal. Zero deps. Foolproof storage + rich commands. */
const KEY="termidroid-pro-v6", OLDKEY="termidroid-clean-v5";
const $=id=>document.getElementById(id);
const output=$("output"),input=$("input"),promptEl=$("prompt"),suggest=$("suggest"),
  overlay=$("overlay"),modalBody=$("modalBody"),modalTitle=$("modalTitle"),
  editor=$("editor"),nano=$("nano"),nums=$("nums"),keybar=$("keybar"),chips=$("chips");

function freshTab(n,cwd){return {name:n||"bash",cwd:cwd||"/home/user",history:[],hi:0,buffer:[],env:{USER:"user",HOST:"termidroid",HOME:"/home/user",PATH:"/bin:/usr/bin",SHELL:"bash",EDITOR:"nano"}}}
function defaults(){return {v:6,theme:"matrix",font:15,keybar:true,haptics:true,suggest:true,chips:true,wrap:true,
  tabs:[freshTab("bash")],active:0,
  files:{"/home/user/readme.txt":"Welcome to TermiDroid Pro.\nMobile-first Linux terminal. Offline + installable.\n\nTry: help | tutorial | todo | neofetch\nTap chips above the keyboard. Swipe the keybar for / | $ etc.",
    "/home/user/notes.txt":"My notes.\n- Tap ⏎ to run\n- nano notes.txt to edit (mobile Save button!)\n- try: calc 2*(3+4) | todo add Buy milk",
    "/home/user/projects/hello.sh":"#!/bin/sh\necho Hello from TermiDroid Pro!\nneofetch"},
  dirs:["/","/home","/home/user","/home/user/documents","/home/user/downloads","/home/user/projects","/tmp"],
  aliases:{ll:"ls -la",la:"ls -la","..":"cd ..","...":"cd ../..",cls:"clear"},
  todos:[{t:"Try voice input + keybar on mobile",done:false},{t:"Run: tutorial",done:false}],
  undo:[]}}
let memFallback=false;
function safeParse(s){try{return JSON.parse(s)}catch(e){return null}}
function loadState(){
  try{
    const raw=localStorage.getItem(KEY);
    if(raw){const s=safeParse(raw);if(s&&Array.isArray(s.tabs)&&s.tabs.length)return normalize(s);}
    const old=localStorage.getItem(OLDKEY);
    if(old){const o=safeParse(old);
      if(o){const files=o.files||defaults().files,dirs=o.dirs||defaults().dirs;
        let tabs;
        if(Array.isArray(o.tabs)&&o.tabs.length&&typeof o.tabs[0]==="object")tabs=o.tabs.map((t,i)=>({name:t.name||("bash-"+(i+1)),cwd:t.cwd||"/home/user",history:t.history||[],hi:(t.history||[]).length,buffer:t.buffer||[],env:t.env||freshTab().env}));
        else{const t=freshTab("bash",o.cwd||"/home/user");t.history=o.history||[];t.hi=t.history.length;tabs=[t];}
        return normalize(Object.assign(defaults(),{theme:o.theme||"matrix",tabs,files,dirs}));}}
  }catch(e){memFallback=true;}
  return defaults();
}
function normalize(s){const d=defaults();const o=Object.assign(d,s);o.v=6;
  if(!Array.isArray(o.tabs)||!o.tabs.length)o.tabs=d.tabs;
  o.active=Math.max(0,Math.min(o.active||0,o.tabs.length-1));
  o.tabs.forEach((t,i)=>{t.name=t.name||("bash-"+(i+1));t.cwd=t.cwd||"/home/user";t.history=t.history||[];t.hi=(t.hi==null)?t.history.length:t.hi;t.buffer=(t.buffer||[]).slice(-500);t.env=Object.assign(freshTab().env,t.env||{});});
  if(!o.files||typeof o.files!=="object")o.files=d.files;
  if(!Array.isArray(o.dirs)||!o.dirs.length)o.dirs=d.dirs;
  if(!o.aliases)o.aliases=d.aliases; if(!Array.isArray(o.todos))o.todos=d.todos; if(!Array.isArray(o.undo))o.undo=[];
  return o;}
let S=loadState();
let saveT=null;
function save(){clearTimeout(saveT);saveT=setTimeout(()=>{try{if(!memFallback)localStorage.setItem(KEY,JSON.stringify(S));}catch(e){/* quota: trim buffers */try{S.tabs.forEach(t=>t.buffer=t.buffer.slice(-150));if(!memFallback)localStorage.setItem(KEY,JSON.stringify(S));}catch(e2){memFallback=true;}}updateStoreMeta();},120);}
function saveNow(){try{if(!memFallback)localStorage.setItem(KEY,JSON.stringify(S))}catch(e){memFallback=true}updateStoreMeta();}

/* ---------- paths / fs ---------- */
function cur(){return S.tabs[S.active]}
function parent(p){if(!p||p==="/")return "/";const a=p.split("/").filter(Boolean);a.pop();return "/"+a.join("/");}
function base(p){if(p==="/")return "/";return p.split("/").pop();}
function norm(p){const parts=(p||"/").split("/").filter(x=>x&&x!==".");const st=[];for(const x of parts){if(x===".."){if(st.length)st.pop();}else st.push(x);}return "/"+st.join("/");}
function resolve(p){p=(p||"").trim();const t=cur();
  if(!p||p==="~")return t.env.HOME||"/home/user";
  if(p==="~/"||p.startsWith("~/"))return norm((t.env.HOME||"/home/user")+"/"+p.slice(2));
  if(p.startsWith("$")){const m=p.match(/^\$([A-Za-z_][A-Za-z0-9_]*)(.*)$/);if(m){const v=t.env[m[1]]||"";return resolve(v+m[2]);}}
  if(p.startsWith("/"))return norm(p);
  return norm(t.cwd+"/"+p);}
function isDir(p){return S.dirs.includes(p)}
function isFile(p){return Object.prototype.hasOwnProperty.call(S.files,p)}
function exists(p){return isDir(p)||isFile(p)}
function ensureParent(p){const d=parent(p);if(isDir(d))return;const segs=d.split("/").filter(Boolean);let acc="";for(const s of segs){acc+="/"+s;if(!isDir(acc)){if(isFile(acc))throw Error("not a directory: "+acc);S.dirs.push(acc);}}}
function descendants(p){const pre=p==="/" ? "/" : p+"/";return S.dirs.filter(d=>d!==p&&d.startsWith(pre)).concat(Object.keys(S.files).filter(f=>f.startsWith(pre)));}
function children(p){const r=[];for(const d of S.dirs)if(d!==p&&parent(d)===p)r.push({name:base(d),dir:true});for(const f of Object.keys(S.files))if(parent(f)===p)r.push({name:base(f),dir:false});return r.sort((a,b)=>Number(b.dir)-Number(a.dir)||a.name.localeCompare(b.name));}
function pushUndo(entry){S.undo.push(entry);S.undo=S.undo.slice(-20);}
function fsize(p){return (S.files[p]||"").length}
function fmtSize(n){if(n<1024)return n+"B";if(n<1048576)return (n/1024).toFixed(1)+"K";return (n/1048576).toFixed(1)+"M"}
function storageUsed(){try{return (JSON.stringify(S)||"").length}catch(e){return 0}}

const KEYDEFS=[{l:"Tab",fn:1},{l:"↑",h:-1,fn:1},{l:"↓",h:1,fn:1},{l:"←",mv:-1,fn:1},{l:"→",mv:1,fn:1},

  b.onclick=e=>{e.preventDefault();buzz(8);keyAction(k);};keybar.appendChild(b);});}
function insertText(s){const st=input.selectionStart??input.value.length,en=input.selectionEnd??input.value.length;input.value=input.value.slice(0,st)+s+input.value.slice(en);const p=st+s.length;input.setSelectionRange(p,p);onInputChanged();focusInput(true);}
function keyAction(k){focusInput(true);
  if(k.fn&&k.l==="Tab"){acceptSuggest()||autocomplete(true);return;}
  if(k.h){histMove(k.h);return;}
  if(k.mv){const p=(input.selectionStart??0)+k.mv;input.setSelectionRange(Math.max(0,Math.min(input.value.length,p)),Math.max(0,Math.min(input.value.length,p)));return;}
  if(k.esc){input.value="";suggest.style.display="none";return;}

  insertText(k.l);}
function focusInput(scroll){try{input.focus({preventScroll:!scroll});}catch(e){input.focus();}if(scroll)scrollBottom();}

/* ---------- autocomplete ---------- */
const ALLCmd=()=>Object.keys(CMDS).sort();
function candidates(){const t=cur();const paths=[...Object.keys(S.files).map(base),...S.dirs.map(base)];const vars=Object.keys(t.env).map(k=>"$"+k);return [...ALLCmd(),...paths,...vars,t.env.HOME? "~":""].filter((x,i,a)=>x&&a.indexOf(x)===i);}
function onInputChanged(){if(!S.suggest){suggest.style.display="none";return;}autocomplete(false);}
function currentToken(){const v=input.value.slice(0,input.selectionStart??input.value.length);const m=v.match(/(?:[^\s"']+|"[^"]*"|'[^']*')$/);let tok=m?m[0]:"";tok=tok.replace(/^["']|["']$/g,"");return tok;}
function autocomplete(forceCycle){const tok=currentToken();if(!tok){suggest.style.display="none";return false;}
  const m=candidates().filter(x=>x.toLowerCase().startsWith(tok.toLowerCase())).slice(0,7);
  if(!m.length){suggest.style.display="none";return false;}
  if(forceCycle&&m.length===1){applyCompletion(m[0],tok);return true;}
  suggest.innerHTML="";m.forEach((x,i)=>{const d=document.createElement("div");if(i===0)d.className="active";d.textContent=x;
    d.onclick=e=>{e.preventDefault();applyCompletion(x,tok);};suggest.appendChild(d);});
  suggest.style.display="block";return true;}
function applyCompletion(word,tok){const pos=input.selectionStart??input.value.length;const before=input.value.slice(0,pos-tok.length);const after=input.value.slice(pos);input.value=before+word+after;const p=(before+word).length;input.setSelectionRange(p,p);suggest.style.display="none";focusInput(true);}
function acceptSuggest(){const a=suggest.querySelector(".active");if(suggest.style.display==="block"&&a){applyCompletion(a.textContent,currentToken());return true;}return false;}
function histMove(d){const t=cur();if(!t.history.length)return;t.hi=Math.max(0,Math.min(t.history.length,(t.hi==null?t.history.length:t.hi)+d));input.value=t.history[t.hi]||"";suggest.style.display="none";}

/* ---------- command engine: ; && || | > >> $VAR ~ quotes ---------- */
function tokenize(str){const re=/(?:[^\s"']+|"[^"]*"|'[^']*')+/g;const a=str.match(re)||[];return a.map(x=>{if(x.length>=2&&((x[0]==='"'&&x.slice(-1)==='"')||(x[0]==="'"&&x.slice(-1)==="'")))return x.slice(1,-1);return x;});}
function expandArg(a){const t=cur();if(a==="~"||a.startsWith("~/"))return (t.env.HOME||"/home/user")+a.slice(1);
  return a.replace(/\$([A-Za-z_][A-Za-z0-9_]*|\?|\$)/g,(m,n)=>{if(n==="?")return "0";if(n==="$")return String(Math.floor(Math.random()*32768));return t.env[n]||"";});}
function splitTop(s,delim){const out=[];let curS="",q=null;for(let i=0;i<s.length;i++){const c=s[i];
  if(q){curS+=c;if(c===q)q=null;continue;}if(c==='"'||c==="'"){q=c;curS+=c;continue;}
  if(s.startsWith(delim,i)){out.push(curS);curS="";i+=delim.length-1;continue;}curS+=c;}out.push(curS);return out;}
function findRedirect(s){let q=null;for(let i=s.length-1;i>=0;i--){const c=s[i];if(q){if(c===q)q=null;continue;}if(c==='"'||c==="'"){q=c;continue;}
  if(c===">" ){if(s[i-1]===">")return {op:">>",idx:i-1};return {op:">",idx:i};}}return null;}
function run(raw){raw=(raw||"").trim();if(!raw)return;const t=cur();
  commandLine(raw);t.history.push(raw);t.history=t.history.slice(-300);t.hi=t.history.length;
  buzz(8);
  try{
    const groups=splitTop(raw,";").map(s=>s.trim()).filter(Boolean);
    for(const g of groups){runAndList(g);}
  }catch(e){print(String(e&&e.message||e),"err");}
  finishRun();}
function runAndList(g){const orParts=splitTop(g,"||");let ok=false,lastErr=null;
  // emulate || : try each until success; emulate && inside each
  for(const or of orParts){const andParts=splitTop(or,"&&").map(s=>s.trim()).filter(Boolean);let allOk=true;
    for(const seg of andParts){const r=runPipeline(seg);if(!r.ok){allOk=false;lastErr=r.err;break;}}
    if(allOk){ok=true;break;}}
  if(!ok&&lastErr&&orParts.length>1){/* already printed per-command errors */}}
function runPipeline(seg){seg=seg.trim();if(!seg)return {ok:true};
  const red=findRedirect(seg);let redOp=null,redFile=null,left=seg;
  if(red){redOp=red.op;redFile=seg.slice(red.idx+red.op.length).trim();left=seg.slice(0,red.idx).trim();
    if(!redFile){print("syntax error near `>'","err");return {ok:false,err:1};}}
  const stages=splitTop(left,"|").map(s=>s.trim());
  let stdin="";let lastOut="";let ok=true;
  for(let i=0;i<stages.length;i++){const st=stages[i];if(!st){print("syntax error near `|'","err");return {ok:false,err:1};}
    const toks=tokenize(st).map(expandArg);if(!toks.length)continue;
    let cmd=(toks.shift()||"").toLowerCase();
    const t=cur();
    if(S.aliases&&S.aliases[cmd]&&i===0&&stages.length===1&&!redOp){/* alias expand single */const ex=S.aliases[cmd]+" "+toks.join(" ");return runPipeline(ex.trim());}
    if(!CMDS[cmd]){ // try !n history exec
      if(cmd.startsWith("!")){const n=parseInt(cmd.slice(1),10);const h=t.history[t.history.length-1-n]??t.history[n-1];if(h){print(h,"muted");return runPipeline(h);}print(cmd+": event not found","err");return {ok:false,err:127};}
      if(cmd==="sudo"){print("user is not in the sudoers file. This incident will be reported (not really).","err");return {ok:false,err:1};}
      print(cmd+": command not found — try: help","err");return {ok:false,err:127};}
    try{const out=CMDS[cmd](toks,stdin,{seg:st});lastOut=(out==null?"":String(out));stdin=lastOut;}
    catch(e){print(String(e.message||e),"err");return {ok:false,err:1};}}
  if(redOp){try{const p=resolve(tokenize(redFile).map(expandArg).join(" ")||"");if(isDir(p)){print(redFile+": Is a directory","err");return {ok:false,err:1};}
      ensureParent(p);pushUndo({k:"file",p,prev:isFile(p)?S.files[p]:null});
      S.files[p]=(redOp===">>"&&isFile(p)?S.files[p]:"")+lastOut+(lastOut&&!lastOut.endsWith("\n")?"\n":"");
      print((redOp===">>"?"appended ":"written ")+p,"info");
    }catch(e){print(String(e.message||e),"err");return {ok:false,err:1};}}
  else if(lastOut!==""){print(lastOut);}
  return {ok:true};}
function finishRun(){updatePrompt();renderTabs();save();suggest.style.display="none";focusInput(false);}

/* ---------- commands ---------- */
function needFile(p){const r=resolve(p);if(isDir(r))throw Error("Is a directory: "+p);if(!isFile(r))throw Error("No such file: "+p);return r;}
function lsImpl(long,all,p){if(!isDir(p))throw Error("no such directory: "+p);
  const kids=children(p).filter(k=>all||!k.name.startsWith("."));
  if(!long)return kids.map(k=>k.dir?k.name+"/":k.name).join("    ")||"(empty)";
  const lines=["total "+kids.length];kids.forEach(k=>{const fp=p==="/" ? "/"+k.name : p+"/"+k.name;
    const sz=k.dir?descendants(fp).length+" items":fmtSize(fsize(fp));lines.push((k.dir?"d":"-")+"rw-r--r-- 1 user user "+String(sz).padStart(8)+"  "+k.name+(k.dir?"/":""));});
  return lines.join("\n");}
const CMDS={
help(){return "TermiDroid Pro — commands\n\nFILES   ls [-la] [dir] · ll · cd · pwd · cat · less · head/tail [n] · grep · wc · sort · uniq · cut · find · tree · stat · file · du\nEDIT    mkdir [-p] · touch · write <f> <text> · append <f> <text> · nano|vi <f> · cp · mv|rename · rm [-r] [-f] · rmdir · undo\nRUN     echo · printf · calc <expr> · js <code> · sh|run <.sh|.js> · sh supports echo|calc|ls\nSHELL   history · !n · alias · unalias · env|printenv · export K=V · unset K · clear · exit\nSYS     date · cal · whoami · hostname · uname · uptime · id · neofetch · battery\nMOBILE  theme [name] · font [12-20] · keys [on|off] · chips [on|off] · settings · backup · restore · download|dl · upload|import · share · open\nTODO    todo [add|list|done|rm|clear] · note <text> · cheat · tutorial · man <cmd> · version\n\nPIPES   cmd1 | cmd2 · echo hi > f · echo hi >> f · a && b · a || b · a ; b · \"quotes\" · $VAR · ~\nKEYS    special keybar above keyboard · Tab completes · ↑↓ history · ⏎ runs";},
man(a){const c=(a[0]||"").toLowerCase();if(!c)return "usage: man <command>  (try: man ls)";const pages={ls:"ls [-la] [path]\n  -l long · -a show dotfiles",cd:"cd [dir]\n  ~ home · .. up · / root · - back",grep:"grep [-i] <pattern> [file]\n  reads pipe too: cat f | grep x",nano:"nano [file]\n  mobile editor: big Save/Exit, Tab key in toolbar",theme:"theme [matrix|amoled|dracula|amber|light]",backup:"backup\n  downloads termidroid-backup.json (files+todos)"};
    if(pages[c])return c+" — "+pages[c];if(CMDS[c])return c+" — builtin (see: help)";throw Error("no manual entry for "+c);},
tutorial(){return ["★ TERMIDROID PRO · 60-SECOND TOUR","1) ls -la            list files","2) nano notes.txt   edit (tap Save)","3) todo add Ship app  track tasks","4) calc 2*(3+4)     built-in math","5) echo hi > hi.txt  redirect to file","6) cat hi.txt | grep hi  pipes work","7) theme dracula    5 themes · font 17","8) backup           download your data","Tip: use the keybar for / | $ \" ' Tab ⏎"].join("\n");},
start(){return CMDS.tutorial();},hints(){return CMDS.tutorial();},cheat(){return "CHEAT\n  Tab complete · ↑↓ history · Ctrl+L clear · Ctrl+T tab\n  ls -la · cat f · head f 5 · grep -i err log · wc f\n  echo a > f · echo b >> f · cat f | sort | uniq\n  mkdir -p a/b · touch f · cp a b · mv a b · rm -r dir\n  nano f · backup · restore · share · theme · font";},
shortcuts(){return CMDS.cheat();},
clear(){output.innerHTML="";cur().buffer=[];return null;},cls(){return CMDS.clear();},
exit(a){closeTab(S.active);return null;},logout(){return CMDS.exit();},
pwd(a,s,ctx){return cur().cwd;},
ls(a,stdin){let long=false,all=false,path=null;for(const x of a){if(x.startsWith("-")&&!path){if(x.includes("l"))long=true;if(x.includes("a"))all=true;}else path=x;}return lsImpl(long,all,resolve(path||""));},
ll(a){return CMDS.ls(["-la",...a]);},la(a){return CMDS.ls(["-la",...a]);},dir(a){return CMDS.ls(a);},
cd(a){const t=cur();let p=(a[0]||"~");if(p==="-"){p=t._old||"~";}const r=resolve(p);if(!isDir(r))throw Error("cd: no such directory: "+p);t._old=t.cwd;t.cwd=r;updatePrompt();return null;},
cat(a,stdin){if(!a.length){if(stdin!=="")return stdin;throw Error("usage: cat <file>  (or pipe input)");}
  return a.map(f=>{const p=needFile(f);return S.files[p];}).join(a.length>1?"\n":"");},
less(a,s){const t=a.length?CMDS.cat(a,""):s;if(t==="")return "(empty)";const L=t.split("\n");return L.slice(0,60).join("\n")+(L.length>60?"\n…("+L.length+" lines, use: head/tail)":"");},

head(a,stdin){let n=10,files=[];for(const x of a){if(/^-?\d+$/.test(x))n=Math.abs(parseInt(x,10));else if(x==="-n"||x.startsWith("-"))continue;else files.push(x);}
  const txt=files.length?CMDS.cat(files,""):stdin;if(txt===""&&!files.length)throw Error("usage: head <file> [n]");return txt.split("\n").slice(0,n).join("\n");},
tail(a,stdin){let n=10,files=[];for(const x of a){if(/^-?\d+$/.test(x))n=Math.abs(parseInt(x,10));else files.push(x);}
  const txt=files.length?CMDS.cat(files,""):stdin;if(txt===""&&!files.length)throw Error("usage: tail <file> [n]");const L=txt.split("\n");return L.slice(-n).join("\n");},
grep(a,stdin){let ci=false,pat=null,files=[];for(const x of a){if(x==="-i"){ci=true;continue;}if(pat===null&&!isFile(resolve(x))&&stdin===""&&a.length<=2){pat=x;continue;}if(pat===null){pat=x;continue;}files.push(x);}
  if(pat==null)throw Error("usage: grep [-i] <pattern> [file]");
  const txt=files.length?CMDS.cat(files,""):stdin;const needle=ci?pat.toLowerCase():pat;
  const hits=txt.split("\n").filter(l=>(ci?l.toLowerCase():l).includes(needle));return hits.join("\n")||"no matches";},
wc(a,stdin){const txt=a.length?CMDS.cat(a,""):stdin;if(txt===""&&!a.length&&stdin==="")throw Error("usage: wc <file>");
  const lines=txt?txt.split("\n").length:0,words=txt.split(/\s+/).filter(Boolean).length;return lines+" "+words+" "+txt.length+(a[0]?" "+a[0]:"");},
sort(a,stdin){const txt=a.length?CMDS.cat(a,""):stdin;const u=a.includes("-u");let L=txt.split("\n");if(a.includes("-r"))L=L.sort().reverse();else L=L.sort();if(u)L=[...new Set(L)];return L.join("\n");},
uniq(a,stdin){const txt=a.length?CMDS.cat(a,""):stdin;const L=txt.split("\n");const out=[];for(const l of L)if(!out.length||out[out.length-1]!==l)out.push(l);return out.join("\n");},
cut(a,stdin){let d=" ",f="1";const files=[];for(let i=0;i<a.length;i++){if(a[i]==="-d"){d=a[++i];}else if(a[i]==="-f"){f=a[++i];}else files.push(a[i]);}
  const txt=files.length?CMDS.cat(files,""):stdin;const idxs=f.split(",").map(x=>parseInt(x,10)-1).filter(x=>x>=0);
  return txt.split("\n").map(l=>{const p=l.split(d);return idxs.map(i=>p[i]??"").join(d);}).join("\n");},
find(a){const q=(a[0]||"").toLowerCase();const all=[...S.dirs,...Object.keys(S.files)];return all.filter(x=>x.toLowerCase().includes(q)).join("\n")||"no matches";},
tree(){const rec=(p,n)=>{let r=["  ".repeat(n)+(n?"└─ ":"")+base(p)+(isDir(p)?"/":"")];if(isDir(p))children(p).forEach(c=>r.push(...rec(p==="/"?"":p+"/"+c.name===" /"?"":""+(p==="/" ? "/"+c.name : p+"/"+c.name),n+1)));return r;};
  const rec2=(p,n)=>{let r=["  ".repeat(n)+(n?"└─ ":"")+base(p)+(isDir(p)?"/":"")];if(isDir(p))children(p).forEach(c=>r.push(...rec2(p==="/" ? "/"+c.name : p+"/"+c.name,n+1)));return r;};
  return rec2("/home/user",0).join("\n");},
stat(a){if(!a[0])throw Error("usage: stat <path>");const p=resolve(a[0]);if(isDir(p))return "directory "+p+"\nchildren: "+children(p).length;const f=needFile(a[0]);return "file "+f+"\nsize: "+S.files[f].length+" chars · lines: "+(S.files[f]?S.files[f].split("\n").length:0);},
file(a){if(!a[0])throw Error("usage: file <path>");const p=resolve(a[0]);if(isDir(p))return p+": directory";needFile(a[0]);const t=S.files[p]||"";return p+": "+(p.endsWith(".sh")?"shell script":p.endsWith(".js")?"javascript":p.endsWith(".json")?"json":t.startsWith("#!")?"script":"text")+", "+t.length+" bytes";},
du(){const all=[...S.dirs];return all.map(d=>fmtSize(JSON.stringify(descendants(d)).length)+"  "+d).join("\n");},
mkdir(a){let mkp=false,dirs=[];for(const x of a){if(x==="-p")mkp=true;else dirs.push(x);}if(!dirs.length)throw Error("usage: mkdir [-p] <dir>");
  const outs=[];for(const d of dirs){const p=resolve(d);if(exists(p))throw Error("mkdir: exists: "+d);

function downloadText(name,text){const blob=new Blob([text],{type:"text/plain"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{a.remove();URL.revokeObjectURL(a.href);},500);}
function promptCopy(text){if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).catch(()=>fallbackCopy(text));}else fallbackCopy(text);}
function fallbackCopy(text){const ta=document.createElement("textarea");ta.value=text;document.body.appendChild(ta);ta.select();try{document.execCommand("copy")}catch(e){}ta.remove();}

function pickRestore(){const i=document.createElement("input");i.type="file";i.accept=".json,application/json";i.onchange=()=>{const f=i.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.files)throw Error("bad backup");pushUndo({k:"tree",p:"/restore",dirs:[...S.dirs],files:JSON.parse(JSON.stringify(S.files))});
    S.files=d.files;S.dirs=d.dirs||S.dirs;S.todos=d.todos||S.todos;S.aliases=d.aliases||S.aliases;saveNow();renderAll();print("restored "+Object.keys(S.files).length+" files ✓","ok");}catch(e){print("restore failed: "+e.message,"err");}};r.readAsText(f);};i.click();}

  if(!isFile(p)){ensureParent(p);S.files[p]="";}
  $("editPath").textContent=p;nano.value=S.files[p];nano.dataset.dirty="0";editor.style.display="flex";updateNums();updateNanoStat();applyWrap();buildNanoTools();setTimeout(()=>nano.focus(),50);}
function saveEditor(){S.files[$("editPath").textContent]=nano.value;nano.dataset.dirty="0";saveNow();updateNanoStat();print("[nano] saved "+$("editPath").textContent,"info");buzz(12);}
function closeEditor(){if(nano.dataset.dirty==="1"){saveEditor();}editor.style.display="none";renderOutput();updatePrompt();focusInput(false);}
function updateNums(){const n=nano.value.split("\n").length;let s="";for(let i=1;i<=n;i++)s+=i+"\n";nums.textContent=s;}
function updateNanoStat(){const v=nano.value;const dirty=nano.dataset.dirty==="1"?"●":"○";$("nanoStat").textContent=dirty+" "+v.split("\n").length+" lines · "+v.length+" chars · "+$("editPath").textContent;}
function applyWrap(){editWrapOn=!!S.wrap;nano.style.whiteSpace=editWrapOn?"pre-wrap":"pre";$("wrapState").textContent=editWrapOn?"on":"off";}
function buildNanoTools(){const bar=$("nanoTools");bar.innerHTML="";["Tab","/","|","$",'"',"'",":",";","(",")","#","-","_"].forEach(k=>{const b=document.createElement("button");b.className="ebtn";b.textContent=k;b.onclick=()=>{const s=nano.selectionStart??nano.value.length;const ins=k==="Tab"?"  ":k;nano.setRangeText(ins,s,nano.selectionEnd??s,"end");nano.dataset.dirty="1";updateNums();updateNanoStat();nano.focus();};bar.appendChild(b);});}

/* ---------- prefs/theme ---------- */
function setTheme(m){S.theme=m;document.documentElement.setAttribute("data-theme",m);let tc="#000000";if(m==="light")tc="#f6f6f6";if(m==="dracula")tc="#282a36";try{document.querySelector('meta[name="theme-color"]').content=tc;}catch(e){}}
function applyPrefs(){document.documentElement.style.setProperty("--fs",S.font+"px");setTheme(S.theme);}
function renderAll(){applyPrefs();renderTabs();renderOutput();updatePrompt();renderChips();renderKeybar();updateStoreMeta();}

/* ---------- events ---------- */
$("menuBtn").onclick=()=>{buzz(8);openMenu();};
$("modalClose").onclick=closeModal;
overlay.onclick=e=>{if(e.target===overlay)closeModal();};
$("newTab").onclick=()=>{buzz(8);newTab();};
$("installBtn").onclick=async()=>{if(deferredPrompt){deferredPrompt.prompt();try{await deferredPrompt.userChoice;}catch(e){}deferredPrompt=null;$("installBtn").style.display="none";}};
function submitInput(){const v=input.value;input.value="";suggest.style.display="none";run(v);focusInput(false);}
$("sendBtn").onclick=e=>{e.preventDefault();submitInput();};
input.addEventListener("input",onInputChanged);
input.addEventListener("keydown",e=>{
  if(e.key==="Enter"){e.preventDefault();submitInput();return;}
  if(e.key==="Tab"){e.preventDefault();if(!acceptSuggest())autocomplete(true);return;}
  if(e.key==="ArrowUp"&&!suggestOpenNav(e)){e.preventDefault();histMove(-1);return;}
  if(e.key==="ArrowDown"&&!suggestOpenNav(e)){e.preventDefault();histMove(1);return;}
  if(e.key==="Escape"){input.value="";suggest.style.display="none";return;}
  if(e.key==="l"&&e.ctrlKey){e.preventDefault();run("clear");return;}
});
function suggestOpenNav(e){if(suggest.style.display!=="block")return false;const items=[...suggest.children];let idx=items.findIndex(x=>x.classList.contains("active"));
  if(e.key==="ArrowUp"||e.key==="ArrowDown"){e.preventDefault();idx=e.key==="ArrowDown"?Math.min(items.length-1,idx+1):Math.max(0,idx-1);items.forEach(x=>x.classList.remove("active"));if(items[idx])items[idx].classList.add("active");return true;}return false;}
output.addEventListener("click",()=>focusInput(false));
// swipe up/down on output for history? keep simple: double-tap clears? no.
document.addEventListener("keydown",e=>{
  if(editor.style.display==="flex")return;
  if(e.ctrlKey&&e.key.toLowerCase()==="l"){e.preventDefault();run("clear");}
  if(e.ctrlKey&&e.key.toLowerCase()==="t"){e.preventDefault();newTab();}
});
nano.addEventListener("input",()=>{nano.dataset.dirty="1";updateNums();updateNanoStat();});
nano.addEventListener("scroll",()=>{nums.scrollTop=nano.scrollTop;});
nano.addEventListener("keydown",e=>{
  if(e.ctrlKey&&e.key.toLowerCase()==="x"){e.preventDefault();closeEditor();}
  else if(e.ctrlKey&&e.key.toLowerCase()==="o"){e.preventDefault();saveEditor();}
  else if(e.key==="Escape"){e.preventDefault();closeEditor();}
  else if(e.key==="Tab"){e.preventDefault();const s=nano.selectionStart;nano.setRangeText("  ",s,nano.selectionEnd,"end");nano.dataset.dirty="1";updateNums();updateNanoStat();}
});
$("saveBtn").onclick=()=>saveEditor();
$("exitBtn").onclick=()=>closeEditor();
$("wrapToggle").onclick=()=>{S.wrap=!S.wrap;save();applyWrap();};
if("SpeechRecognition" in window||"webkitSpeechRecognition" in window){const mb=$("micBtn");mb.style.display="block";
  mb.onclick=()=>{try{const R=new (window.SpeechRecognition||window.webkitSpeechRecognition)();R.lang=navigator.language||"en-US";R.interimResults=false;mb.textContent="…";R.onresult=ev=>{const txt=ev.results[0][0].transcript;input.value+=(input.value?input.value+" ":"")+txt;onInputChanged();focusInput(true);mb.textContent="🎙";};R.onend=()=>mb.textContent="🎙";R.onerror=()=>mb.textContent="🎙";R.start();}catch(e){mb.style.display="none";}};}
$("filepick").addEventListener("change",e=>{const files=[...e.target.files];if(!files.length)return;let n=0;
  files.forEach(f=>{const r=new FileReader();r.onload=()=>{try{const p=norm(cur().cwd+"/"+f.name);ensureParent(p);pushUndo({k:"file",p,prev:isFile(p)?S.files[p]:null});S.files[p]=String(r.result||"");n++;if(n===files.length){saveNow();print("imported "+n+" file(s) → "+cur().cwd,"ok");}}catch(err){print("import failed: "+err.message,"err");}};r.readAsText(f);});e.target.value="";});
window.addEventListener("online",()=>{$("netMeta").textContent="●";$("netMeta").style.color="var(--green)";});
window.addEventListener("offline",()=>{$("netMeta").textContent="○";$("netMeta").style.color="var(--red)";});
window.addEventListener("error",e=>{try{print("error: "+(e.message||"unknown"),"err");}catch(_){}});
// keep output pinned when mobile keyboard opens
if(window.visualViewport){window.visualViewport.addEventListener("resize",()=>{scrollBottom();});}
setInterval(()=>{try{$("clock").textContent=new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});}catch(e){}},5000);

/* ---------- boot ---------- */
const BOOT=Date.now();
applyPrefs();renderAll();
$("netMeta").style.color=navigator.onLine?"var(--green)":"var(--red)";
$("netMeta").textContent=navigator.onLine?"●":"○";
getBattSync();
if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol)){navigator.serviceWorker.register("sw.js").catch(()=>{});}
setTimeout(()=>{const sp=$("splash");sp.style.opacity="0";setTimeout(()=>sp.remove(),350);},650);
if(!cur().buffer.length){
  print("TermiDroid Pro 6 · pocket linux","info");
  print("Last login: "+new Date().toLocaleString(),"muted");
  print("Tap a chip ↑ or type: tutorial","ok");
  try{const tip=["tip: keybar has / | $ \" Tab — swipe it →","tip: echo hello > hi.txt · cat hi.txt","tip: nano notes.txt has big Save for thumbs","tip: backup downloads everything as JSON","tip: calc 2*(3+4) · js 2**10 · neofetch"][new Date().getDate()%5];print(tip,"muted");}catch(e){}
}else renderOutput();
updatePrompt();focusInput(false);
</script>
</body>
</html>
