<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="description" content="A clean, installable browser-based Linux-style terminal simulator with a persistent virtual filesystem.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%23000'/%3E%3Ctext x='14' y='66' font-family='monospace' font-size='46' fill='%2358ff7a'%3E%3E_%3C/text%3E%3C/svg%3E">
<title>TermiDroid Terminal</title>
<style>
:root{
  --bg:#000;--bar:#0b0b0b;--text:#f2f2f2;--muted:#777;
  --green:#58ff7a;--blue:#5aa9ff;--red:#ff5f5f;--yellow:#ffd75f;
  --border:#1d1d1d;--selection:#193c25;
  --mono:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace
}
html[data-theme="light"]{
  --bg:#f4f4f4;--bar:#e9e9e9;--text:#111;--muted:#777;
  --green:#0a8a2e;--blue:#0b5fd1;--red:#c22;--yellow:#a67c00;
  --border:#d5d5d5;--selection:#cdeed6
}
html[data-theme="light"] .output,html[data-theme="light"] .input-row,
html[data-theme="light"] .terminal-head,html[data-theme="light"] .status,
html[data-theme="light"] .app,html[data-theme="light"] #editor,
html[data-theme="light"] .nano{background:var(--bg);color:var(--text)}
html[data-theme="light"] .nano-top,html[data-theme="light"] .nano-foot{background:#e9e9e9;color:#333}
html[data-theme="light"] .out{color:#222}
*{box-sizing:border-box}
*::selection{background:var(--selection)}
html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text)}
body{font-family:var(--mono);overflow:hidden}
.app{height:100dvh;display:flex;flex-direction:column;background:#000}
.top{
  height:44px;flex:0 0 44px;background:var(--bar);border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 8px;gap:7px
}
.window-dots{display:flex;gap:5px;margin:0 4px 0 2px}
.window-dots i{width:9px;height:9px;border-radius:50%;background:#444}
.title{font-size:12px;color:#aaa;white-space:nowrap}
.tabs{display:flex;align-self:stretch;align-items:end;gap:2px;flex:1;overflow:auto;margin-left:6px}
.tab{
  height:34px;min-width:110px;max-width:180px;padding:0 10px;
  border:1px solid transparent;border-bottom:0;border-radius:7px 7px 0 0;
  background:transparent;color:#777;display:flex;align-items:center;gap:8px;cursor:pointer
}
.tab.active{background:#000;color:#ddd;border-color:var(--border)}
.tab .close{margin-left:auto;color:#555}.tab .close:hover{color:#fff}
.topbtn{
  width:31px;height:31px;border:1px solid transparent;background:transparent;color:#777;
  border-radius:6px;cursor:pointer;font-size:16px
}
.topbtn:hover{background:#171717;color:#fff}
.main{position:relative;flex:1;min-height:0;display:flex}
.terminal{width:100%;height:100%;display:flex;flex-direction:column;min-width:0}
.terminal-head{
  height:27px;flex:0 0 27px;border-bottom:1px solid #111;background:#050505;
  color:#555;display:flex;align-items:center;padding:0 12px;font-size:10px
}
.terminal-head span:last-child{margin-left:auto}
.output{
  flex:1;min-height:0;overflow:auto;padding:14px 14px 8px;
  font-size:14px;line-height:1.55;white-space:pre-wrap;word-break:break-word;
  -webkit-overflow-scrolling:touch
}
.output::-webkit-scrollbar{width:8px}.output::-webkit-scrollbar-thumb{background:#222;border-radius:10px}
.line{min-height:1.55em}.prompt{color:var(--green)}.out{color:#ddd}.muted{color:var(--muted)}
.err{color:var(--red)}.info{color:var(--blue)}.warn{color:var(--yellow)}
.input-row{
  flex:0 0 auto;display:flex;align-items:center;gap:7px;padding:7px 14px 13px;
  background:#000;border-top:1px solid #090909
}
.prompt-live{color:var(--green);white-space:nowrap;font-size:14px}
.input{
  min-width:0;flex:1;border:0;outline:0;background:transparent;color:#fff;
  font:14px var(--mono);padding:0;caret-color:var(--green)
}
.input::placeholder{color:#444}
.suggest{
  position:absolute;left:14px;right:14px;bottom:54px;max-width:520px;
  background:#0b0b0b;border:1px solid #2a2a2a;border-radius:6px;overflow:hidden;
  display:none;z-index:10;box-shadow:0 8px 28px #000
}
.suggest div{padding:7px 10px;font-size:12px;color:#bbb;cursor:pointer}
.suggest div.active,.suggest div:hover{background:#151515;color:#fff}
.status{
  height:22px;flex:0 0 22px;border-top:1px solid #111;background:#070707;
  color:#4f4f4f;display:flex;align-items:center;padding:0 10px;font-size:10px
}
.status span+span{margin-left:15px}.status .right{margin-left:auto}
.overlay{
  position:absolute;inset:0;background:#000d;display:none;z-index:50;
  align-items:center;justify-content:center;padding:18px
}
.modal{
  width:min(560px,100%);max-height:85%;overflow:auto;background:#0b0b0b;
  border:1px solid #2a2a2a;border-radius:8px;box-shadow:0 20px 70px #000;
}
.modal-head{height:42px;display:flex;align-items:center;padding:0 13px;border-bottom:1px solid #202020;font-size:12px;color:#bbb}
.modal-head button{margin-left:auto;background:none;border:0;color:#777;cursor:pointer;font-size:18px}
.modal-body{padding:14px;font-size:12px;line-height:1.7;color:#bbb}
.fs{font-size:12px}.fs-row{padding:4px 0}.dir{color:var(--blue)}.file{color:#ddd}
#editor{position:absolute;inset:0;background:#000;display:none;z-index:60;flex-direction:column}
.nano-top{height:34px;background:#111;border-bottom:1px solid #292929;display:flex;align-items:center;padding:0 10px;font-size:12px}
.nano-top b{color:#fff}.nano-top span{margin-left:auto;color:#666}
.nano-body{flex:1;min-height:0;display:flex}
.nums{width:38px;flex:0 0 38px;padding:9px 6px 9px 0;text-align:right;color:#444;line-height:1.5;font-size:13px;overflow:hidden;user-select:none}
.nano{
  flex:1;min-width:0;resize:none;border:0;outline:0;background:#000;color:#ddd;
  font:13px/1.5 var(--mono);padding:9px 8px;white-space:pre;overflow:auto
}
.nano-foot{height:39px;border-top:1px solid #222;background:#111;color:#777;display:flex;align-items:center;padding:0 10px;font-size:10px;gap:13px}
.nano-foot b{color:#fff}
@media(max-width:600px){
  .top{height:40px;flex-basis:40px}.window-dots{display:none}.title{display:none}
  .tabs{margin-left:0}.tab{min-width:92px;height:31px;font-size:11px}
  .output{padding:10px 10px 5px;font-size:13px}.input-row{padding:7px 10px 11px}
  .prompt-live,.input{font-size:13px}.terminal-head{padding:0 10px}
  .status{font-size:9px}.status span:nth-child(2){display:none}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="window-dots"><i></i><i></i><i></i></div>
    <div class="title">TermiDroid</div>
    <div class="tabs" id="tabs"></div>
    <button class="topbtn" id="newTab" title="New tab">+</button>
    <button class="topbtn" id="fileBtn" title="Virtual filesystem">⌂</button>
    <button class="topbtn" id="helpBtn" title="Help">?</button>
  </header>

  <main class="main">
    <section class="terminal">
      <div class="terminal-head">
        <span>termidroid / virtual-linux</span>
        <span id="termPath">/home/user</span>
      </div>
      <div class="output" id="output"></div>
      <div class="input-row">
        <span class="prompt-live" id="prompt"></span>
        <input class="input" id="input" autocomplete="off" autocapitalize="off" spellcheck="false" autofocus>
        <div class="suggest" id="suggest"></div>
      </div>
      <footer class="status">
        <span>UTF-8</span><span>bash</span><span>local storage</span>
        <span class="right" id="clock"></span>
      </footer>
    </section>

    <div class="overlay" id="overlay">
      <div class="modal">
        <div class="modal-head"><span id="modalTitle">Virtual filesystem</span><button id="modalClose">×</button></div>
        <div class="modal-body" id="modalBody"></div>
      </div>
    </div>

    <section id="editor">
      <div class="nano-top"><b>GNU nano</b>&nbsp; <span id="editPath"></span><span>^X Exit · ^O Save</span></div>
      <div class="nano-body"><div class="nums" id="nums"></div><textarea id="nano" class="nano" spellcheck="false"></textarea></div>
      <div class="nano-foot"><span><b>^O</b> Write Out</span><span><b>^X</b> Exit</span><span><b>^K</b> Cut</span><span><b>^W</b> Search</span></div>
    </section>
  </main>
</div>

<script>
const KEY="termidroid-clean-v5";
function freshTab(name,cwd){return {name,cwd:cwd||"/home/user",history:[],hi:0,buffer:[]}}
const baseState={
  theme:"dark",
  tabs:[freshTab("bash")],
  active:0,
  files:{
    "/home/user/readme.txt":"Welcome to TermiDroid.\nA clean browser-based Linux terminal.\nType 'help' to see every command.",
    "/home/user/notes.txt":"This file is persistent.\nTry editing it with: nano notes.txt",
    "/home/user/projects/hello.sh":"#!/bin/sh\necho Hello from TermiDroid!"
  },
  dirs:["/home","/home/user","/home/user/documents","/home/user/downloads","/home/user/projects"]
};
function migrate(old){
  // Upgrade older save formats (single shared cwd/history) to the per-tab model.
  if(!old)return null;
  if(Array.isArray(old.tabs)&&old.tabs.length&&typeof old.tabs[0]==="object")return old;
  const tab=freshTab("bash",old.cwd);
  tab.history=old.history||[];
  return {theme:old.theme||"dark",tabs:[tab],active:0,files:old.files||baseState.files,dirs:old.dirs||baseState.dirs};
}
let S=migrate(JSON.parse(localStorage.getItem(KEY)||"null"))||structuredClone(baseState);
const $=x=>document.getElementById(x);
const output=$("output"),input=$("input"),prompt=$("prompt"),suggest=$("suggest");
const overlay=$("overlay"),modalBody=$("modalBody"),editor=$("editor"),nano=$("nano"),nums=$("nums");

function cur(){return S.tabs[S.active]}
function save(){localStorage.setItem(KEY,JSON.stringify(S))}
function pathDisplay(){const t=cur();return t.cwd==="/home/user"?"~":t.cwd.replace("/home/user","~")}
function updatePrompt(){prompt.textContent=`user@termidroid:${pathDisplay()}$`;$("termPath").textContent=cur().cwd}
function parent(p){let a=p.split("/").filter(Boolean);a.pop();return "/"+a.join("/")}
function base(p){return p.split("/").pop()}
function resolve(p){
  if(!p||p==="~")return "/home/user";
  let a=p.startsWith("/")?[]:cur().cwd.split("/").filter(Boolean);
  for(let x of p.split("/")){if(!x||x===".")continue;if(x==="..")a.pop();else a.push(x)}
  return "/"+a.join("/")
}
function isDir(p){return S.dirs.includes(p)}
function isFile(p){return Object.prototype.hasOwnProperty.call(S.files,p)}
function descendants(p){return S.dirs.filter(d=>d!==p&&d.startsWith(p+"/")).concat(Object.keys(S.files).filter(f=>f.startsWith(p+"/")))}
function children(p){
  const r=[];
  for(const d of S.dirs)if(d!==p&&parent(d)===p)r.push({name:base(d),dir:true});
  for(const f of Object.keys(S.files))if(parent(f)===p)r.push({name:base(f),dir:false});
  return r.sort((a,b)=>Number(b.dir)-Number(a.dir)||a.name.localeCompare(b.name))
}
function renderOutput(){
  output.innerHTML="";
  cur().buffer.forEach(l=>{
    const d=document.createElement("div");d.className="line "+(l.cls||"out");
    if(l.prompt){
      const p=document.createElement("span");p.className="prompt";p.textContent=l.prompt+" ";
      d.append(p,document.createTextNode(l.text))
    }else d.textContent=l.text;
    output.appendChild(d)
  });
  output.scrollTop=output.scrollHeight
}
function print(text="",cls="out"){
  cur().buffer.push({text,cls});cur().buffer=cur().buffer.slice(-500);
  const d=document.createElement("div");d.className="line "+cls;d.textContent=text;
  output.appendChild(d);output.scrollTop=output.scrollHeight
}
function commandLine(s){
  cur().buffer.push({text:s,cls:"",prompt:prompt.textContent});cur().buffer=cur().buffer.slice(-500);
  const d=document.createElement("div");d.className="line";
  const p=document.createElement("span");p.className="prompt";p.textContent=prompt.textContent+" ";
  d.append(p,document.createTextNode(s));output.appendChild(d)
}
function renderTabs(){
  const box=$("tabs");box.innerHTML="";
  S.tabs.forEach((t,i)=>{
    const b=document.createElement("button");b.className="tab "+(i===S.active?"active":"");
    b.innerHTML=`<span>● ${t.name}</span><span class="close">×</span>`;
    b.onclick=e=>{
      if(e.target.classList.contains("close")&&S.tabs.length>1){
        S.tabs.splice(i,1);S.active=Math.max(0,Math.min(S.active,S.tabs.length-1))
      }else S.active=i;
      renderTabs();renderOutput();updatePrompt();save()
    };
    box.appendChild(b)
  })
}
function renderFS(){
  modalBody.innerHTML="";
  function add(p,depth){
    const d=document.createElement("div");d.className="fs-row "+(isDir(p)?"dir":"file");
    d.style.paddingLeft=(depth*14)+"px";d.textContent=(isDir(p)?"\u{1F4C1} ":"\u{1F4C4} ")+p;
    d.onclick=()=>{if(isFile(p)){closeModal();openEditor(p)}};
    modalBody.appendChild(d);
    if(isDir(p))children(p).forEach(c=>add(p+"/"+c.name,depth+1))
  }
  add("/home/user",0)
}
function closeModal(){overlay.style.display="none"}
$("fileBtn").onclick=()=>{renderFS();$("modalTitle").textContent="Virtual filesystem";overlay.style.display="flex"};
$("modalClose").onclick=closeModal;
overlay.onclick=e=>{if(e.target===overlay)closeModal()};

const commands=["help","clear","ls","pwd","cd","cat","mkdir","touch","write","rm","cp","mv","nano",
  "history","echo","date","whoami","uname","find","tree","head","tail","grep","wc","export","theme","reset","exit"];
function completions(){
  return [...commands,...Object.keys(S.files).map(base),...S.dirs.map(base)]
    .filter((x,i,a)=>a.indexOf(x)===i)
}
function autocomplete(){
  const parts=input.value.split(/\s+/),token=parts.at(-1)||"";
  if(!token){suggest.style.display="none";return}
  const m=completions().filter(x=>x.toLowerCase().startsWith(token.toLowerCase())).slice(0,7);
  if(!m.length){suggest.style.display="none";return}
  suggest.innerHTML="";
  m.forEach((x,i)=>{
    const d=document.createElement("div");d.className=i===0?"active":"";
    d.textContent=x;d.onclick=()=>{input.value=input.value.slice(0,input.value.length-token.length)+x;suggest.style.display="none";input.focus()};
    suggest.appendChild(d)
  });
  suggest.style.display="block"
}
function downloadText(name,text){
  const blob=new Blob([text],{type:"text/plain"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(a.href)
}
function setTheme(mode){
  S.theme=mode==="light"?"light":"dark";
  document.documentElement.setAttribute("data-theme",S.theme)
}
function run(raw){
  raw=raw.trim();if(!raw)return;
  const t=cur();
  commandLine(raw);t.history.push(raw);t.history=t.history.slice(-200);t.hi=t.history.length;
  const a=raw.match(/(?:[^\s"]+|"[^"]*")+/g)||[],c=(a.shift()||"").toLowerCase(),args=a.map(x=>x.replace(/^"|"$/g,""));
  try{
    if(c==="help")print(`Linux-like commands

  ls [-la]              list files
  cd <dir>              change directory
  pwd                   print directory
  cat <file>            read a file
  nano <file>           edit a file
  mkdir [-p] <dir>       create directory (-p makes parents)
  touch <file>          create file
  write <file> <text>   write file
  rm [-r] <file|dir>    remove file/directory (-r recursive)
  cp <src> <dst>        copy file
  mv <src> <dst>        move file
  find <text>           find paths
  tree                  filesystem tree
  head/tail <file> [n]  first/last n lines (default 10)
  grep <text> <file>    print matching lines
  wc <file>             count lines/words/chars
  export <file>         download a virtual file to your device
  theme <light|dark>    switch color theme
  history               command history
  echo <text>           print text
  date                  current date/time
  whoami                current user
  uname                 system information
  clear                 clear terminal
  reset                 wipe the virtual filesystem back to defaults
  exit                  close current tab

Keyboard: Tab autocomplete \u00b7 \u2191/\u2193 history \u00b7 Ctrl+L clear \u00b7 Ctrl+T new tab`,"out");
    else if(c==="clear"){output.innerHTML="";t.buffer=[]}
    else if(c==="pwd")print(t.cwd);
    else if(c==="ls"){
      let p=args[0]&&args[0][0]!=="-"?resolve(args[0]):t.cwd;
      if(!isDir(p))throw Error("ls: no such directory: "+p);
      print(children(p).map(x=>x.dir?x.name+"/":x.name).join("    ")||"(empty)")
    }else if(c==="cd"){
      let p=resolve(args[0]||"~");if(!isDir(p))throw Error("cd: no such directory: "+p);t.cwd=p
    }else if(c==="cat"){
      let p=resolve(args[0]);if(isDir(p))throw Error("cat: "+p+": Is a directory");
      if(!isFile(p))throw Error("cat: "+p+": No such file");print(S.files[p])
    }else if(c==="mkdir"){
      let recursive=args[0]==="-p",target=recursive?args[1]:args[0];
      if(!target)throw Error("mkdir: missing operand");
      let p=resolve(target);
      if(isDir(p)||isFile(p))throw Error("mkdir: cannot create directory: File exists");
      if(!isDir(parent(p))){
        if(!recursive)throw Error("mkdir: parent directory does not exist (use -p)");
        let segs=p.split("/").filter(Boolean),acc="";
        for(const seg of segs){acc+="/"+seg;if(!isDir(acc)&&!isFile(acc))S.dirs.push(acc)}
      }else S.dirs.push(p);
      print("created "+p,"info")
    }else if(c==="touch"){
      if(!args[0])throw Error("touch: missing file operand");let p=resolve(args[0]);
      if(isDir(p))throw Error("touch: "+p+": Is a directory");
      if(!isFile(p))S.files[p]="";print("created "+p,"info")
    }else if(c==="write"){
      if(args.length<2)throw Error("usage: write <file> <text>");
      let p=resolve(args[0]);if(isDir(p))throw Error("write: "+p+": Is a directory");
      S.files[p]=args.slice(1).join(" ");print("written "+p,"info")
    }else if(c==="rm"){
      let recursive=args[0]==="-r"||args[0]==="-rf",target=recursive?args[1]:args[0];
      if(!target)throw Error("rm: missing operand");
      let p=resolve(target);
      if(isFile(p)){delete S.files[p];print("removed "+p,"info")}
      else if(isDir(p)&&p!=="/home/user"){
        const kids=descendants(p);
        if(kids.length&&!recursive)throw Error("rm: "+p+": Directory not empty (use -r)");
        kids.forEach(k=>{delete S.files[k]});
        S.dirs=S.dirs.filter(x=>x!==p&&!kids.includes(x));
        print("removed "+p,"info")
      }else throw Error("rm: cannot remove "+p)
    }else if(c==="cp"){
      if(args.length<2)throw Error("usage: cp <source> <destination>");
      let s=resolve(args[0]),d=resolve(args[1]);if(!isFile(s))throw Error("cp: source is not a file");
      S.files[d]=S.files[s];print(`${s} -> ${d}`,"info")
    }else if(c==="mv"){
      if(args.length<2)throw Error("usage: mv <source> <destination>");
      let s=resolve(args[0]),d=resolve(args[1]);if(!isFile(s))throw Error("mv: source is not a file");
      S.files[d]=S.files[s];delete S.files[s];print(`${s} -> ${d}`,"info")
    }else if(c==="nano"){openEditor(resolve(args[0]||"notes.txt"))}
    else if(c==="history")print(t.history.map((x,i)=>String(i+1).padStart(3)+"  "+x).join("\n"));
    else if(c==="echo")print(args.join(" "));
    else if(c==="date")print(new Date().toString());
    else if(c==="whoami")print("user");
    else if(c==="uname")print("TermiDroid Linux 2.0 (virtual kernel)");
    else if(c==="find"){let q=(args[0]||"").toLowerCase();print([...S.dirs,...Object.keys(S.files)].filter(x=>x.toLowerCase().includes(q)).join("\n")||"no matches")}
    else if(c==="tree"){
      function tr(p,n){let r=["  ".repeat(n)+(n?"\u2514\u2500 ":"")+base(p)+(isDir(p)?"/":"")];if(isDir(p))children(p).forEach(x=>r.push(...tr(p+"/"+x.name,n+1)));return r}
      print(tr("/home/user",0).join("\n"))
    }else if(c==="head"||c==="tail"){
      if(!args[0])throw Error(c+": missing file operand");
      let p=resolve(args[0]);if(!isFile(p))throw Error(c+": "+p+": No such file");
      let n=parseInt(args[1],10);if(!Number.isFinite(n)||n<=0)n=10;
      let lines=(S.files[p]||"").split("\n");
      print((c==="head"?lines.slice(0,n):lines.slice(-n)).join("\n"))
    }else if(c==="grep"){
      if(args.length<2)throw Error("usage: grep <text> <file>");
      let p=resolve(args[1]);if(!isFile(p))throw Error("grep: "+p+": No such file");
      let needle=args[0].toLowerCase();
      let hits=(S.files[p]||"").split("\n").filter(l=>l.toLowerCase().includes(needle));
      print(hits.join("\n")||"no matches")
    }else if(c==="wc"){
      if(!args[0])throw Error("wc: missing file operand");
      let p=resolve(args[0]);if(!isFile(p))throw Error("wc: "+p+": No such file");
      let text=S.files[p]||"",lines=text?text.split("\n").length:0,words=text.split(/\s+/).filter(Boolean).length;
      print(`${lines} ${words} ${text.length} ${p}`)
    }else if(c==="export"){
      if(!args[0])throw Error("export: missing file operand");
      let p=resolve(args[0]);if(!isFile(p))throw Error("export: "+p+": No such file");
      downloadText(base(p),S.files[p]||"");print("downloaded "+base(p),"info")
    }else if(c==="theme"){
      if(!args[0]){print("current theme: "+S.theme);return finish()}
      if(args[0]!=="light"&&args[0]!=="dark")throw Error("usage: theme <light|dark>");
      setTheme(args[0]);print("theme set to "+args[0],"info")
    }else if(c==="reset"){
      if(args[0]!=="--yes"){print("this wipes the virtual filesystem. Run: reset --yes","warn");return finish()}
      S.files=structuredClone(baseState.files);S.dirs=structuredClone(baseState.dirs);t.cwd="/home/user";
      print("filesystem reset to defaults","info")
    }else if(c==="exit"){
      if(S.tabs.length>1){S.tabs.splice(S.active,1);S.active=Math.max(0,S.active-1);renderTabs();renderOutput()}
      else print("exit: cannot close the last terminal","warn")
    }else throw Error(c+": command not found")
  }catch(e){print(e.message,"err")}
  finish();
  function finish(){updatePrompt();renderTabs();save();suggest.style.display="none";input.focus()}
}
function openEditor(p){
  if(!isFile(p))S.files[p]="";
  $("editPath").textContent=p;nano.value=S.files[p];nano.dataset.dirty="0";editor.style.display="flex";updateNums();nano.focus()
}
function saveEditor(){S.files[$("editPath").textContent]=nano.value;nano.dataset.dirty="0";save();print("[nano] saved "+$("editPath").textContent,"info")}
function closeEditor(){
  if(nano.dataset.dirty==="1")saveEditor();
  editor.style.display="none";renderTabs();renderOutput();updatePrompt();input.focus()
}
function updateNums(){nums.textContent=nano.value.split("\n").map((_,i)=>String(i+1)).join("\n")}
nano.addEventListener("input",()=>{nano.dataset.dirty="1";updateNums()});
nano.addEventListener("scroll",()=>nums.scrollTop=nano.scrollTop);
nano.addEventListener("keydown",e=>{
  if(e.ctrlKey&&e.key.toLowerCase()==="x"){e.preventDefault();closeEditor()}
  if(e.ctrlKey&&e.key.toLowerCase()==="o"){e.preventDefault();saveEditor()}
  if(e.key==="Escape"){e.preventDefault();closeEditor()}
  if(e.ctrlKey&&e.key.toLowerCase()==="k"){
    e.preventDefault();let s=nano.selectionStart,eol=nano.value.indexOf("\n",s);if(eol<0)eol=nano.value.length;
    let bol=nano.value.lastIndexOf("\n",s-1)+1;nano.value=nano.value.slice(0,bol)+nano.value.slice(eol+(eol<nano.value.length?1:0));
    nano.dataset.dirty="1";updateNums()
  }
});
input.addEventListener("input",autocomplete);
input.addEventListener("keydown",e=>{
  if(e.key==="Enter"){e.preventDefault();run(input.value);input.value="";return}
  if(e.key==="Tab"){
    e.preventDefault();let x=suggest.querySelector(".active");
    if(x){let token=input.value.split(/\s+/).at(-1)||"";input.value=input.value.slice(0,input.value.length-token.length)+x.textContent;suggest.style.display="none"}
    else autocomplete();return
  }
  if(e.key==="ArrowUp"){
    e.preventDefault();const t=cur();t.hi=Math.max(0,(t.hi??t.history.length)-1);input.value=t.history[t.hi]||"";return
  }
  if(e.key==="ArrowDown"){
    e.preventDefault();const t=cur();t.hi=Math.min(t.history.length,(t.hi??t.history.length)+1);input.value=t.history[t.hi]||"";return
  }
});
output.addEventListener("click",()=>input.focus());
document.addEventListener("keydown",e=>{
  if(editor.style.display==="flex")return;
  if(e.ctrlKey&&e.key.toLowerCase()==="l"){e.preventDefault();output.innerHTML="";cur().buffer=[]}
  if(e.ctrlKey&&e.key.toLowerCase()==="t"){e.preventDefault();newTab()}
});
$("newTab").onclick=()=>newTab();
function newTab(){
  S.tabs.push(freshTab("bash-"+(S.tabs.length+1)));S.active=S.tabs.length-1;
  renderTabs();renderOutput();print("new terminal tab","info");updatePrompt();save();input.focus()
}
$("helpBtn").onclick=()=>{input.value="help";input.focus()};
setInterval(()=>{$("clock").textContent=new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit",second:"2-digit"})},1000);

setTheme(S.theme);
if(!cur().buffer.length){
  print("TermiDroid Linux 2.0","info");
  print("Last login: "+new Date().toLocaleString(),"muted");
  print("Type 'help' for available commands.","muted");
}else renderOutput();
updatePrompt();renderTabs();input.focus();
</script>
</body>
</html>
